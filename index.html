<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>pakus web corner</title>
    </head>
    <body>
        <header id="site-header">
            <h1>pakus web corner</h1>
        </header>

        <main id="home-content">
            <section id="news-section" data-home-panel="news">
                <header>
                    <h2>
                        <button
                            type="button"
                            data-panel-toggle
                            aria-expanded="true"
                            aria-controls="nachrichten-list"
                        >
                            neues
                        </button>
                    </h2>
                </header>
                <div id="nachrichten-list">
                    <p>loading nachrichten...</p>
                </div>
            </section>

            <section id="links-section" data-home-panel="links">
                <header>
                    <h2>
                        <button
                            type="button"
                            data-panel-toggle
                            aria-expanded="true"
                            aria-controls="link-list"
                        >
                            aether portal
                        </button>
                    </h2>
                </header>
                <nav id="link-list" aria-label="externe links">
                    <ul>
                        <li>
                            <a
                                href="https://github.com/PakuBK"
                                target="_blank"
                                rel="noreferrer"
                            >
                                github
                            </a>
                        </li>
                        <li>
                            <a
                                href="https://www.instagram.com/paku.io/"
                                target="_blank"
                                rel="noreferrer"
                            >
                                instagram
                            </a>
                        </li>
                        <li>
                            <a href="./pages/kontakt.html">kontakt</a>
                        </li>
                    </ul>
                </nav>
            </section>

            <section id="posts-section" data-home-panel="posts">
                <header>
                    <h2>
                        <button
                            type="button"
                            data-panel-toggle
                            aria-expanded="true"
                            aria-controls="post-container"
                        >
                            fundkiste
                        </button>
                    </h2>
                </header>
                <div id="post-container">
                    <p>loading posts...</p>
                </div>
            </section>
        </main>

        <script type="module" src="./main.js"></script>
    </body>
</html>
