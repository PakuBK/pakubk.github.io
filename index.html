<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>pakus web corner</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap"
            rel="stylesheet"
        />
        <link href="./css/index.css" rel="stylesheet" />
    </head>
    <body>
        <header id="site-header">
            <h1>pakus web scroll</h1>
        </header>

        <main id="home-content">
            <section id="news-section" data-home-panel="news">
                <header>
                    <h2>neues</h2>
                </header>
                <div id="nachrichten-list">
                    <p>loading nachrichten...</p>
                </div>
            </section>

            <section id="links-section" data-home-panel="links">
                <header>
                    <h2>aether portal</h2>
                </header>
                <nav id="link-list" aria-label="externe links">
                    <ul>
                        <li>
                            <a
                                href="https://github.com/PakuBK"
                                target="_blank"
                                rel="noreferrer"
                            >
                                github
                            </a>
                        </li>
                        <li>
                            <a
                                href="https://www.instagram.com/paku.io/"
                                target="_blank"
                                rel="noreferrer"
                            >
                                instagram
                            </a>
                        </li>
                        <li>
                            <a href="./pages/kontakt.html">kontakt</a>
                        </li>
                        <li>
                            <a href="./pages/lyrik.html">lyrik</a>
                        </li>
                        <li>
                            <a href="./pages/kontakt.html">bilder</a>
                        </li>
                    </ul>
                </nav>
            </section>

            <section id="spotify-section" aria-labelledby="spotify-heading">
                <header>
                    <h2 id="spotify-heading">zuletzt gehört</h2>
                </header>
                <div id="spotify-widget" aria-live="polite">
                    <p>loading track...</p>
                </div>
            </section>

            <section id="posts-section" data-home-panel="posts">
                <header>
                    <h2>fundkiste</h2>
                </header>
                <div id="post-container">
                    <p>loading posts...</p>
                </div>
            </section>
        </main>

        <script type="module" src="./main.js"></script>
    </body>
</html>
