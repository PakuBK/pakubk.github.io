name: Post lyrical artwork
description: Publish a poem or other text-based lyrical artwork.
title: ""
body:
  - type: textarea
    id: work-text
    attributes:
      label: Text
      description: Use the issue title as the artwork title. Line breaks and empty lines will be preserved.
      placeholder: Write or paste your text here.
    validations:
      required: true
  - type: checkboxes
    id: publish-confirmation
    attributes:
      label: Publish
      options:
        - label: Publish this issue as a lyrical artwork.
          required: true
