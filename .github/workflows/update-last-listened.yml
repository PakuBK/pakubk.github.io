name: Update last listened Spotify track

on:
  schedule:
    # Offset from minute zero to reduce GitHub's peak-hour scheduling delays.
    - cron: "3/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mobile-content-publishing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Check out latest content
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch last listened track
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/update-spotify.js

      - name: Commit and push changed track
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/spotify.json
          if git diff --cached --quiet; then
            echo "Last listened track is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update last listened Spotify track"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.update.outputs.commit_sha }}
